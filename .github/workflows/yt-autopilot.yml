name: YT Autopilot Core

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q yt_autopilot tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
